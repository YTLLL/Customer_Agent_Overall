[tool.poetry]
name = "hotel-reasoning-agent"
version = "0.1.0"
description = "酒店服务与退票 Reasoning Agent，处理酒店换房/退租和退票需求"
authors = ["Your Name <your.email@example.com>"]
packages = [{include = "agent"}]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.0"
uvicorn = "^0.23.2"
langchain = "^0.1.0"
langchain-openai = "^0.0.2"
langgraph = "^0.0.49"
pydantic = "^2.4.2"
python-dotenv = "^1.0.0"
pymongo = "^4.6.0"
requests = "^2.31.0"
openai = "^1.3.0"
typingx = "^0.1.0"
twilio = "^8.10.0"
python-multipart = "^0.0.6"
# 图像处理相关依赖
pillow = "^11.2.1"
motor = "^3.7.0"

[tool.poetry.dev-dependencies]
pytest = "7.4.3"
pytest-asyncio = "0.21.1"
black = "^23.9.1"
isort = "^5.12.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"